  kicker: 'Black October · ≥ {{ n.art.wiz_black_october.platforms }} AI dev platforms · Railway'
  title: They came for the <em>AI keys</em>
  steps:
    - { title: Build escape, desc: "Unknown bug in build VM isolation", icon: "lucide:box" }
    - { title: Build credential, desc: "Trusted by Temporal → internal monorepo", icon: "lucide:key" }
    - { title: OIDC misconfig, desc: "Erroneous binding = cloud foothold", icon: "lucide:cloud" }
    - { title: KMS decrypt, desc: 'Env vars of ≤ {{ n.art.railway.workspaces_pct | num(2) }}% of workspaces', icon: "lucide:lock-open" }
    - { title: Keys resold, desc: '~${{ n.art.railway.spend_usd | num }} spent; detected after ~{{ n.art.railway.detect_hours | num(1) }} h', icon: "lucide:badge-dollar-sign" }
  foot: 'Sources: Railway incident report (Nov 10), Wiz "Black October"'
  notes: |
    Railway: "{{ n.art.railway.quote_target }}". And: "{{ n.art.railway.quote_speed }}".
    Wiz: attackers were "{{ n.art.wiz_black_october.quote_hunt }}"
    Lessons: one ephemeral VM per build; short-lived, narrow credentials; audit every decrypt; alert on anomalous API use.

wfxloot:
  kicker: wfx-loot · from Nov 10
  title: One stolen token each. <em>Rotation is not cleanup.</em>
  stats:
    - { value: '{{ n.art.wfx_loot.accounts | num }}', label: hijacked GitHub accounts, tone: bad }
    - { value: '{{ n.art.wfx_loot.repos_probed | num }}', label: repositories probed, tone: warn }
    - { value: '{{ n.art.wfx_loot.repos_ran | num }}', label: repos ran the stealer, tone: bad }
  foot: 'Sources: Aikido, Chainguard (Nov 12)'
  notes: |
    Steals CI secrets, cloud credentials and AI tool credentials (Claude, Cursor, Codex…).
    Chainguard: "{{ n.art.wfx_loot.quote_rotation }}" Check AWS trust policies, Azure federated credentials, forged status checks.
    Agent configs are code: review them like CI.

binance:
  kicker: Binance · Oct 29
  title: '${{ n.art.binance.loss_usd_bn | num(1) }}B started with a <em>job interview</em>'
  aside: press coverage
  events:
    - { date: Jun, title: Tampered Homebrew package, desc: '"while searching for an AI tool"' }
    - { date: Sep, title: Fake job interview, desc: "coding task → malware past EDR" }
    - { date: Oct 20, title: Internal AI tool, desc: reached 2 wallet engineers }
    - { date: Oct 29, title: Container + script, desc: "EIP-7702: one signed authorization lets contract code act as the hot wallet" }
    - { date: Oct 30, title: Contained 00:10 UTC, desc: FBI attributes to North Korea }
  foot: 'Sources: CoinDesk (Oct 30, Nov 3), relaying Binance briefings. No published post-mortem yet.'
  notes: |
    EIP-7702 "Set Code for EOAs" (Final): a new transaction type (0x04) carries signed authorizations; each one makes an externally owned account (EOA) delegate execution to contract code until replaced. The spec itself says "There is no safe way to provide this interface": whoever gets that signature controls the wallet. Per Binance (via CoinDesk), the attacker used it to gain execution rights over a hot wallet, and with MPC no single key could revoke it.
    The first public hint was "{{ n.art.binance.quote_laptop }}". The DevOps laptop is production.
    Say it out loud: this comes from press coverage of a Binance briefing, not a post-mortem.

bridge:
  kicker: The soft skill we lack
  title: You are the <em>bridge</em>
  columns:
    - { title: What, items: ["The asset, not the CVE ID", "Which service, which customers"] }
    - { title: So what, items: ["Exposed? Exploited?", "KEV due date, if any"] }
    - { title: Now what, items: ["Mitigation today", "Fix date", "The risk they accept"] }
  foot: Fighting Fire with Fire
  notes: |
    Stakeholders don't speak CVSS, KEV or EPSS, and they are the most-phished people in the company.
    Example: sshole is "Critical, in KEV", but glibc + PAM builds are not affected → "We checked: only our Alpine images. Mitigated today, rebuilt by Friday."
    Teach them the lures: fake recruiters, urgent "security update" mails, fake AI tools.

