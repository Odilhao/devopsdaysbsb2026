hook:
  kicker: CVE.org · CNA CVSS ≥ 9.0
  title: Three months, more <em>Critical</em> CVEs than all of 2025
  series: Critical CVEs
  note: 'Aug–Oct 2026: <strong>{{ n.crit.critical_aug_oct_2026 | num }}</strong> Critical vs {{ n.crit.critical_2025_full_year | num }} in all of 2025. Sep + Oct alone ({{ n.crit.critical_sep_oct_2026 | num }}) > 2018–2022 combined ({{ n.crit.critical_2018_to_2022_sum | num }}).'
  foot: 'Source: CVE.org cvelistV5 · cve_monthly_critical.csv, cve_critical_checks.csv · data as of {{ n.cut | day }} · includes current month to date'
  notes: |
    Fact-check what's going around: Sep + Oct is NOT "more Critical CVEs than all of history".
    CNA-scored Critical before Sep 2026: {{ n.crit.critical_all_before_sep_2026 | num }}; NVD counts {{ n.nvd.all_time.nvd_cvss3_critical | num }} all-time.
    Part of the jump is better scoring: the share of CVEs with a CNA score went from ~60% (2023) to ~79% (2026).

glossary:
  kicker: "Before the numbers"
  title: "The vocabulary of this talk"
  foot: "Sources: cve.org · cisa.gov/known-exploited-vulnerabilities-catalog · first.org/epss · first.org/cvss"
  terms:
    - { title: CVE, desc: "Common Vulnerabilities and Exposures: the ID of a public vulnerability." }
    - { title: CNA, desc: "CVE Numbering Authority: GitHub, Microsoft, the Linux kernel (since 2024)…" }
    - { title: CVSS, desc: "Common Vulnerability Scoring System: 0–10 severity, not real risk." }
    - { title: KEV, desc: "Known Exploited Vulnerabilities: CISA's list of confirmed exploitation." }
    - { title: EPSS, desc: "Exploit Prediction Scoring System: chance of exploitation in 30 days." }
    - { title: VEX, desc: "Vulnerability Exploitability eXchange: vendor says affected or not." }
  notes: |
    Vocabulary before the numbers. A CNA issues CVE IDs: GitHub, Microsoft, VulnCheck and, since February 2024, the Linux kernel itself, which explains much of the 2024 jump.
    CVSS says how bad a bug is technically, not whether anyone is exploiting it. For that: KEV (confirmed exploitation) and EPSS (probability in the next 30 days).
    VEX is what cuts scanner noise. Remember KEV and EPSS: they come back on the signals slide.

curve:
  kicker: Industry-wide
  title: It hits every CNA, and it reaches <em>your</em> stack
  foot: 'Sources: CVE.org cvelistV5, CISA KEV · cve_yearly.csv, kev_yearly.csv, cve_critical_checks.csv · data as of {{ n.cut | day }}'
  stats:
