# Texto em pt-BR para slides/deck.md.j2 (mesmas chaves de en.yaml). Os textos podem usar Jinja:
#   n.<grupo> = dados (scripts/build_slidev.py load_data), n.art.<grupo> = data/manual/article_facts.yaml
#   filtros: num(casas), pct(casas) para frações 0..1, month('2026-10'), day('2026-11-09')
# Use aspas simples em valores com {{ … }} ou ": "; aspas em valores com vírgula dentro de { … }.

cover:
  kicker: 'Feito para o DevOpsDays Brasília 2026 · devopsdaysbsb.com.br'
  title: Apagando fogo com Gasolina
  subtitle: 'Como AI e LLMs impactam o dia a dia do DevOps Engineer com CVEs e Incidentes · gráficos atualizados em {{ n.cut | day }}/{{ n.cut.year }}'
  notes: |
    Estes slides foram criados para o DevOpsDays Brasília 2026 (https://devopsdaysbsb.com.br/). Todo número é gerado a partir de dados públicos por um build de CI; os gráficos foram atualizados em {{ n.cut | day }}/{{ n.cut.year }}.
    Este ano o cano de CVEs estourou. Três partes: a onda, as decisões de engenharia que deixam o fix rápido, e o lado das pessoas.

